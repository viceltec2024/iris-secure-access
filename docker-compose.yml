# Optional full local stack for IRIS Creator platform (Phase 2+ ready).
# Phase 1 API also runs with SQLite without Docker:
#   cd platform/iris-api && uvicorn app.main:app --reload --port 8088
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris_platform
    ports:
      - "5432:5432"
    volumes:
      - iris_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  iris-api:
    build:
      context: ./platform/iris-api
    environment:
      DATABASE_URL: postgresql+psycopg://iris:iris@postgres:5432/iris_platform
      JWT_SECRET: change-me-in-real-deployments
      BOOTSTRAP_ADMIN_EMAIL: admin@iris.local
      BOOTSTRAP_ADMIN_PASSWORD: iris-admin-change-me
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - "8088:8088"
    depends_on:
      - postgres
      - redis

volumes:
  iris_pg:
